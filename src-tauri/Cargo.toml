[package]
name = "ducker"
version = "0.1.0"
description = "Aplicación local de escritorio para gestionar proyectos Symfony/Yarn."
authors = ["Ducker"]
edition = "2021"

[lib]
name = "ducker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
